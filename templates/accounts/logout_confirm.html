{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Log out" %} – AllergenTrace{% endblock %}
{% block content %}
<div class="measure">
  <h1 class="h2 mb-3">{% translate "Log out of AllergenTrace?" %}</h1>
  <form method="post" class="d-flex flex-wrap gap-2">
    {% csrf_token %}
    <button class="btn btn-primary" type="submit">{% translate "Log out" %}</button>
    <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">{% translate "Cancel" %}</a>
  </form>
</div>
{% endblock %}
